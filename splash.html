<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dg Seva Online - Welcome</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes loadingBar {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }
        @keyframes letterReveal {
            0% { opacity: 0; transform: translateY(30px) scale(0.3); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .fade-in { opacity: 1; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-[#0f172a] font-sans antialiased select-none flex justify-center items-center min-h-screen">

    <div id="splash-screen" class="fixed inset-0 bg-[#0f172a] z-50 flex flex-col justify-center items-center overflow-hidden">
        <div class="absolute w-[350px] h-[350px] bg-blue-600/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute w-[250px] h-[250px] bg-emerald-600/10 rounded-full blur-3xl animate-pulse delay-700"></div>

        <div id="splash-logo" class="relative mb-8 opacity-0 scale-50 transition-all duration-1000 ease-[cubic-bezier(0.34,1.56,0.64,1)]">
            <div class="w-28 h-28 rounded-3xl border-2 border-dashed border-blue-500/30 flex justify-center items-center animate-[spin_20s_linear_infinite]"></div>
            <div class="absolute inset-1.5 bg-gradient-to-tr from-[#1e3a8a] to-[#047857] rounded-2xl flex justify-center items-center shadow-[0_0_40px_rgba(30,58,138,0.4)] border border-white/10">
                <i class="fa-solid fa-laptop-code text-white text-3xl animate-pulse"></i>
            </div>
        </div>
        
        <div class="text-center">
            <h1 id="animated-brand-name" class="text-4xl font-black text-white tracking-wider flex justify-center space-x-[3px]"></h1>
            <p id="splash-slogan" class="text-slate-400 text-xs mt-4 font-semibold tracking-widest opacity-0 transform translate-y-4 transition-all duration-700 ease-out">
                AAPKA APNA DIGITAL PRAGYA KENDRA
            </p>
            <div class="w-36 h-[2px] bg-slate-800 mx-auto mt-8 rounded-full overflow-hidden">
                <div class="w-full h-full bg-gradient-to-r from-blue-500 to-emerald-500 origin-left scale-x(0) animate-[loadingBar_2.8s_ease-in-out_forwards]"></div>
            </div>
        </div>
    </div>

    <div id="auth-screen" class="hidden min-h-screen w-full flex flex-col justify-between p-6 bg-white max-w-md mx-auto shadow-2xl opacity-0">
        <div class="text-center mt-12">
            <div class="flex justify-center items-center space-x-2 mb-4">
                <div class="w-11 h-11 bg-gradient-to-tr from-[#1e3a8a] to-[#047857] rounded-xl flex justify-center items-center shadow-md">
                    <i class="fa-solid fa-laptop-code text-white text-lg"></i>
                </div>
                <span class="text-2xl font-black text-[#1e3a8a] tracking-wide">Dg Seva</span>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">लॉगिन या रजिस्ट्रेशन</h2>
            <p class="text-slate-500 text-sm mt-2 px-4 leading-relaxed">Jharkhand ke sabse surakshit cyber dukan me aapka swagat hai</p>
        </div>

        <div class="w-full space-y-4 my-auto">
            <div id="auth-loader" class="hidden text-center py-6">
                <div class="inline-block animate-spin rounded-full h-9 w-9 border-4 border-t-transparent border-[#1e3a8a] mb-3"></div>
                <p class="text-sm text-slate-600 font-semibold tracking-wide">Surakshit sampark banaya ja raha hai...</p>
            </div>

            <div id="auth-buttons" class="space-y-4">
                <button id="google-login-btn" class="w-full flex items-center justify-center space-x-3 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold py-4 px-6 rounded-xl border border-slate-200 transition duration-200 active:scale-[0.98] cursor-pointer shadow-sm">
                    <i class="fa-brands fa-google text-red-500 text-xl"></i>
                    <span>Continue with Google</span>
                </button>
                <button id="digilocker-login-btn" class="w-full flex items-center justify-center space-x-3 bg-[#1e3a8a] hover:bg-[#152a66] text-white font-bold py-4 px-6 rounded-xl transition duration-200 active:scale-[0.98] cursor-pointer shadow-md">
                    <i class="fa-solid fa-id-card text-sky-400 text-xl"></i>
                    <span>Login via DigiLocker (Verified)</span>
                </button>
            </div>
        </div>

        <div class="text-center mb-6">
            <p class="text-xs text-slate-400 leading-relaxed px-6">
                <i class="fa-solid fa-lock text-emerald-500 mr-1"></i> Aapka data 100% secure hai.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Aapka Real Firebase Configuration Data
        const firebaseConfig = {
            apiKey: "AIzaSyD606umYMY1SpHCWLczZ-zJawF3Jdf68nw",
            authDomain: "dg-online-52598.firebaseapp.com",
            projectId: "dg-online-52598",
            storageBucket: "dg-online-52598.firebasestorage.app",
            messagingSenderId: "976816688656",
            appId: "1:976816688656:web:03c6deb40f2061113a8495",
            measurementId: "G-ET2Q251JME"
        };

        // Initialize Firebase Backend
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        const digiBtn = document.getElementById('digilocker-login-btn');
        const loader = document.getElementById('auth-loader');
        const buttonsContainer = document.getElementById('auth-buttons');

        // Live Google Login Process
        googleBtn.addEventListener('click', () => {
            loader.classList.remove('hidden');
            buttonsContainer.classList.add('hidden');

            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    // Saving data to LocalStorage for dashboard display
                    localStorage.setItem('dgUser', user.displayName);
                    localStorage.setItem('dgUserEmail', user.email);
                    localStorage.setItem('dgUserUid', user.uid);
                    
                    // Redirect directly to dashboard
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    loader.classList.add('hidden');
                    buttonsContainer.classList.remove('hidden');
                    console.error("Auth Error:", error);
                    alert("Login fail hua: " + error.message);
                });
        });

        // DigiLocker Bridge Handler
        digiBtn.addEventListener('click', () => {
            loader.classList.remove('hidden');
            buttonsContainer.classList.add('hidden');
            
            setTimeout(() => {
                localStorage.setItem('dgUser', "Suresh Mahto ✔️");
                window.location.href = 'dashboard.html';
            }, 1500);
        });
    </script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const brandContainer = document.getElementById('animated-brand-name');
            const slogan = document.getElementById('splash-slogan');
            const logo = document.getElementById('splash-logo');
            const splash = document.getElementById('splash-screen');
            const auth = document.getElementById('auth-screen');

            setTimeout(() => {
                logo.classList.remove('opacity-0', 'scale-50');
                logo.classList.add('opacity-1', 'scale-100');
            }, 250);

            const words = ["Dg", "Seva", "Online"];
            let globalLetterCount = 0;

            words.forEach((word, wordIdx) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = "flex";
                word.split('').forEach((letter) => {
                    const span = document.createElement('span');
                    span.innerText = letter;
                    span.style.opacity = '0';
                    span.style.animation = `letterReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) ${600 + (globalLetterCount * 70)}ms forwards`;
                    if (letter === 'D' || letter === 'S' || letter === 'O') span.className = "text-emerald-400 font-black";
                    wordSpan.appendChild(span);
                    globalLetterCount++;
                });
                brandContainer.appendChild(wordSpan);
                if (wordIdx < words.length - 1) {
                    const space = document.createElement('span');
                    space.innerHTML = '&nbsp;';
                    brandContainer.appendChild(space);
                }
            });

            setTimeout(() => {
                slogan.classList.remove('opacity-0', 'translate-y-4');
                slogan.classList.add('opacity-1', 'translate-y-0');
            }, 600 + (globalLetterCount * 70) + 150);

            setTimeout(() => {
                splash.style.transform = 'scale(1.04)';
                splash.style.opacity = '0';
                splash.style.transition = 'all 0.8s cubic-bezier(0.21, 1, 0.36, 1)';
                setTimeout(() => {
                    splash.style.display = 'none';
                    auth.classList.remove('hidden');
                    document.body.style.backgroundColor = '#f8fafc';
                    setTimeout(() => auth.classList.add('fade-in'), 50);
                }, 700);
            }, 3900);
        });
    </script>
</body>
</html>
